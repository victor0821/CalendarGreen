<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CalendarGreen</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeos.
      // Todo en try/catch: el almacenamiento puede no estar disponible (modo privado).
      ;(function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('calendargreen-theme')
          if (saved === 'light' || saved === 'dark') {
            theme = saved
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark'
          }
        } catch (e) {
          /* sin almacenamiento: se usa el tema por defecto */
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
